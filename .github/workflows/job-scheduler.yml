name: Automated WhatsApp Job Dispatcher

on:
  schedule:
    # Government Jobs Slot 1 (08:45 AM IST = 03:15 UTC)
    - cron: '15 3 * * *'
    # Tech Jobs Slot 1 (09:45 AM IST = 04:15 UTC)
    - cron: '15 4 * * *'
    # Internships Slot 1 (10:15 AM IST = 04:45 UTC)
    - cron: '45 4 * * *'
    # Non-Tech Jobs Slot 1 (11:00 AM IST = 05:30 UTC)
    - cron: '30 5 * * *'
    # Referrals & Startups (01:45 PM IST = 08:15 UTC)
    - cron: '15 8 * * *'
    # Internships Slot 2 (05:30 PM IST = 12:00 UTC)
    - cron: '0 12 * * *'
    # Tech Jobs Slot 2 (06:15 PM IST = 12:45 UTC)
    - cron: '45 12 * * *'
    # Non-Tech Jobs Slot 2 (07:15 PM IST = 13:45 UTC)
    - cron: '45 13 * * *'
    # Government Jobs Slot 2 (08:15 PM IST = 14:45 UTC)
    - cron: '45 14 * * *'
    # Daily Digest (09:00 PM IST = 15:30 UTC)
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to dispatch manually'
        required: true
        default: 'TECH'
        type: choice
        options:
          - TECH
          - GOVT
          - INTERNSHIP
          - NON_TECH
          - REFERRAL
          - DIGEST

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright & Chromium
        run: npx playwright install --with-deps chromium


      - name: Restore WhatsApp Session From Bundle
        env:
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
        run: |
          mkdir -p data
          npx tsx scripts/decrypt_session.ts

      - name: Run Job Dispatch
        env:
          TZ: 'Asia/Kolkata'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WHATSAPP_SESSION_PATH: './data/whatsapp_session'
          WHATSAPP_HEADLESS: 'false'
          WHATSAPP_GROUP_TECH: ${{ secrets.WHATSAPP_GROUP_TECH || 'Tech Jobs' }}
          WHATSAPP_GROUP_INTERNSHIP: ${{ secrets.WHATSAPP_GROUP_INTERNSHIP || 'Internships' }}
          WHATSAPP_GROUP_NON_TECH: ${{ secrets.WHATSAPP_GROUP_NON_TECH || 'Non-Tech Jobs' }}
          WHATSAPP_GROUP_GOVT: ${{ secrets.WHATSAPP_GROUP_GOVT || 'Government Jobs' }}
          WHATSAPP_GROUP_REFERRAL: ${{ secrets.WHATSAPP_GROUP_REFERRAL || 'Referrals & Networking' }}
          WHATSAPP_GROUP_COMMUNITY: ${{ secrets.WHATSAPP_GROUP_COMMUNITY || 'Daily Highlights' }}
          CATEGORY_INPUT: ${{ github.event.inputs.category }}
        run: |
          # Helper to execute with real X11 virtual display (bypasses headless detection)
          run_with_display() {
            xvfb-run -a --server-args="-screen 0 1280x800x24 -ac -nolisten tcp" "$@"
          }

          # Run dispatch command and soften only known WhatsApp re-auth failures
          run_dispatch() {
            local output_file
            output_file="$(mktemp)"

            set +e
            run_with_display "$@" 2>&1 | tee "$output_file"
            local status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -ne 0 ] && grep -q "re-authenticate locally using \`npm run auth:whatsapp\`" "$output_file"; then
              echo "::warning::WhatsApp session requires re-authentication; skipping hard failure for this run."
              rm -f "$output_file"
              return 0
            fi

            rm -f "$output_file"
            return "$status"
          }

          # If triggered manually via workflow_dispatch
          if [ -n "$CATEGORY_INPUT" ]; then
            echo "🚀 Manual dispatch for category: $CATEGORY_INPUT"
            run_dispatch npx tsx src/cli/index.ts live --category "$CATEGORY_INPUT" --limit 1
            exit 0
          fi

          # If triggered on cron schedule, detect current IST time and dispatch matching slot
          IST_HM=$(date +"%-H%M")
          IST_READABLE=$(date +"%I:%M %p")
          echo "⏰ Cron triggered. Current IST Time: ${IST_READABLE} (HM: ${IST_HM})"

          # Match IST time window to target category
          if [ "$IST_HM" -ge 815 ] && [ "$IST_HM" -le 915 ]; then
            echo "🎯 Executing: Government Jobs Slot 1 (08:45 AM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category GOVT --limit 1
          elif [ "$IST_HM" -ge 916 ] && [ "$IST_HM" -le 1005 ]; then
            echo "🎯 Executing: Tech Jobs Slot 1 (09:45 AM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category TECH --limit 1
          elif [ "$IST_HM" -ge 1006 ] && [ "$IST_HM" -le 1045 ]; then
            echo "🎯 Executing: Internships Slot 1 (10:15 AM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category INTERNSHIP --limit 1
          elif [ "$IST_HM" -ge 1046 ] && [ "$IST_HM" -le 1200 ]; then
            echo "🎯 Executing: Non-Tech Jobs Slot 1 (11:00 AM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category NON_TECH --limit 1
          elif [ "$IST_HM" -ge 1300 ] && [ "$IST_HM" -le 1500 ]; then
            echo "🎯 Executing: Referrals & Startups (01:45 PM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category REFERRAL --limit 1
          elif [ "$IST_HM" -ge 1700 ] && [ "$IST_HM" -le 1759 ]; then
            echo "🎯 Executing: Internships Slot 2 (05:30 PM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category INTERNSHIP --limit 1
          elif [ "$IST_HM" -ge 1800 ] && [ "$IST_HM" -le 1859 ]; then
            echo "🎯 Executing: Tech Jobs Slot 2 (06:15 PM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category TECH --limit 1
          elif [ "$IST_HM" -ge 1900 ] && [ "$IST_HM" -le 1959 ]; then
            echo "🎯 Executing: Non-Tech Jobs Slot 2 (07:15 PM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category NON_TECH --limit 1
          elif [ "$IST_HM" -ge 2000 ] && [ "$IST_HM" -le 2045 ]; then
            echo "🎯 Executing: Government Jobs Slot 2 (08:15 PM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category GOVT --limit 1
          elif [ "$IST_HM" -ge 2046 ] && [ "$IST_HM" -le 2200 ]; then
            echo "🎯 Executing: Daily Digest (09:00 PM IST)"
            run_dispatch npx tsx src/cli/index.ts live --category DIGEST
          else
            echo "ℹ️ Current time (${IST_READABLE}, HM: ${IST_HM}) is outside all scheduled slots. Skipping dispatch."
            exit 0
          fi

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: data/*.png
          if-no-files-found: ignore

      - name: Persist Active WhatsApp Session & History
        if: always()
        env:
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
        run: |
          if [ -d "data/whatsapp_session/Default" ] && [ -n "$SESSION_PASSWORD" ]; then
            echo "🔒 Updating encrypted session bundle with active ratchet state..."
            npx tsx scripts/encrypt_session.ts "$SESSION_PASSWORD"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/session_bundle.enc data/live_published_history.json
            git commit -m "chore(session): update active session ratchet & deduplication history [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Push skipped or up to date"
          fi
