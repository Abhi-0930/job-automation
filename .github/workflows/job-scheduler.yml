name: Automated WhatsApp Job Dispatcher

on:
  schedule:
    # Government Jobs Slot 1 (08:48 AM IST = 03:18 UTC)
    - cron: '18 3 * * *'
    # Tech Jobs Slot 1 (09:48 AM IST = 04:18 UTC)
    - cron: '18 4 * * *'
    # Internships Slot 1 (10:18 AM IST = 04:48 UTC)
    - cron: '48 4 * * *'
    # Non-Tech Jobs Slot 1 (11:02 AM IST = 05:32 UTC)
    - cron: '32 5 * * *'
    # Referrals & Startups (01:48 PM IST = 08:18 UTC)
    - cron: '18 8 * * *'
    # Internships Slot 2 (05:33 PM IST = 12:03 UTC)
    - cron: '3 12 * * *'
    # Tech Jobs Slot 2 (06:18 PM IST = 12:48 UTC)
    - cron: '48 12 * * *'
    # Non-Tech Jobs Slot 2 (07:18 PM IST = 13:48 UTC)
    - cron: '48 13 * * *'
    # Government Jobs Slot 2 (08:18 PM IST = 14:48 UTC)
    - cron: '48 14 * * *'
    # Daily Digest (09:02 PM IST = 15:32 UTC)
    - cron: '32 15 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to dispatch manually'
        required: true
        default: 'TECH'
        type: choice
        options:
          - TECH
          - GOVT
          - INTERNSHIP
          - NON_TECH
          - REFERRAL
          - DIGEST

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright & Chromium
        run: npx playwright install --with-deps chromium


      - name: Restore WhatsApp Session From Bundle
        env:
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
        run: |
          mkdir -p data
          npx tsx scripts/decrypt_session.ts

      - name: Run Job Dispatch
        env:
          TZ: 'Asia/Kolkata'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WHATSAPP_SESSION_PATH: './data/whatsapp_session'
          WHATSAPP_HEADLESS: 'false'
          WHATSAPP_GROUP_TECH: ${{ secrets.WHATSAPP_GROUP_TECH || 'Tech Jobs' }}
          WHATSAPP_GROUP_INTERNSHIP: ${{ secrets.WHATSAPP_GROUP_INTERNSHIP || 'Internships' }}
          WHATSAPP_GROUP_NON_TECH: ${{ secrets.WHATSAPP_GROUP_NON_TECH || 'Non-Tech Jobs' }}
          WHATSAPP_GROUP_GOVT: ${{ secrets.WHATSAPP_GROUP_GOVT || 'Government Jobs' }}
          WHATSAPP_GROUP_REFERRAL: ${{ secrets.WHATSAPP_GROUP_REFERRAL || 'Referrals & Networking' }}
          WHATSAPP_GROUP_COMMUNITY: ${{ secrets.WHATSAPP_GROUP_COMMUNITY || 'Daily Highlights' }}
          CATEGORY_INPUT: ${{ github.event.inputs.category }}
          CRON_TRIGGER: ${{ github.event.schedule }}
        run: |
          # Helper to execute with real X11 virtual display (bypasses headless detection)
          run_with_display() {
            xvfb-run -a --server-args="-screen 0 1280x800x24 -ac -nolisten tcp" "$@"
          }

          # Run dispatch command and soften only known WhatsApp re-auth failures
          run_dispatch() {
            local output_file
            output_file="$(mktemp)"

            set +e
            run_with_display "$@" 2>&1 | tee "$output_file"
            local status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -ne 0 ] && grep -q "re-authenticate locally using \`npm run auth:whatsapp\`" "$output_file"; then
              echo "::warning::WhatsApp session requires re-authentication; skipping hard failure for this run."
              rm -f "$output_file"
              return 0
            fi

            rm -f "$output_file"
            return "$status"
          }

          # 1. Manual dispatch via workflow_dispatch
          if [ -n "$CATEGORY_INPUT" ]; then
            echo "🚀 Manual dispatch for category: $CATEGORY_INPUT"
            run_dispatch npx tsx src/cli/index.ts live --category "$CATEGORY_INPUT" --limit 1
            exit 0
          fi

          # 2. Automated Scheduled Dispatch via exact CRON_TRIGGER matching
          echo "⏰ Cron triggered: '$CRON_TRIGGER' | Current IST: $(date +'%I:%M %p')"
          TARGET_CAT=""

          case "$CRON_TRIGGER" in
            "18 3 * * *"|"15 3 * * *")
              TARGET_CAT="GOVT"
              echo "🎯 Matched: Government Jobs Slot 1 (08:48 AM IST)"
              ;;
            "18 4 * * *"|"15 4 * * *")
              TARGET_CAT="TECH"
              echo "🎯 Matched: Tech Jobs Slot 1 (09:48 AM IST)"
              ;;
            "48 4 * * *"|"45 4 * * *")
              TARGET_CAT="INTERNSHIP"
              echo "🎯 Matched: Internships Slot 1 (10:18 AM IST)"
              ;;
            "32 5 * * *"|"30 5 * * *")
              TARGET_CAT="NON_TECH"
              echo "🎯 Matched: Non-Tech Jobs Slot 1 (11:02 AM IST)"
              ;;
            "18 8 * * *"|"15 8 * * *")
              TARGET_CAT="REFERRAL"
              echo "🎯 Matched: Referrals & Startups (01:48 PM IST)"
              ;;
            "3 12 * * *"|"0 12 * * *")
              TARGET_CAT="INTERNSHIP"
              echo "🎯 Matched: Internships Slot 2 (05:33 PM IST)"
              ;;
            "48 12 * * *"|"45 12 * * *")
              TARGET_CAT="TECH"
              echo "🎯 Matched: Tech Jobs Slot 2 (06:18 PM IST)"
              ;;
            "48 13 * * *"|"45 13 * * *")
              TARGET_CAT="NON_TECH"
              echo "🎯 Matched: Non-Tech Jobs Slot 2 (07:18 PM IST)"
              ;;
            "48 14 * * *"|"45 14 * * *")
              TARGET_CAT="GOVT"
              echo "🎯 Matched: Government Jobs Slot 2 (08:18 PM IST)"
              ;;
            "32 15 * * *"|"30 15 * * *")
              TARGET_CAT="DIGEST"
              echo "🎯 Matched: Daily Digest (09:02 PM IST)"
              ;;
            *)
              echo "⚠️ Unmatched cron trigger string: '$CRON_TRIGGER'. Falling back to hour evaluation."
              ;;
          esac

          if [ -n "$TARGET_CAT" ]; then
            run_dispatch npx tsx src/cli/index.ts live --category "$TARGET_CAT" --limit 1
            exit 0
          fi

          # 3. Fallback: Full hour evaluation if CRON_TRIGGER is empty or custom
          HOUR=$(date +"%-H")
          case "$HOUR" in
            8)     run_dispatch npx tsx src/cli/index.ts live --category GOVT --limit 1 ;;
            9)     run_dispatch npx tsx src/cli/index.ts live --category TECH --limit 1 ;;
            10)    run_dispatch npx tsx src/cli/index.ts live --category INTERNSHIP --limit 1 ;;
            11|12) run_dispatch npx tsx src/cli/index.ts live --category NON_TECH --limit 1 ;;
            13|14) run_dispatch npx tsx src/cli/index.ts live --category REFERRAL --limit 1 ;;
            17)    run_dispatch npx tsx src/cli/index.ts live --category INTERNSHIP --limit 1 ;;
            18)    run_dispatch npx tsx src/cli/index.ts live --category TECH --limit 1 ;;
            19)    run_dispatch npx tsx src/cli/index.ts live --category NON_TECH --limit 1 ;;
            20)    run_dispatch npx tsx src/cli/index.ts live --category GOVT --limit 1 ;;
            21)    run_dispatch npx tsx src/cli/index.ts live --category DIGEST --limit 1 ;;
            *)
              echo "ℹ️ Current hour ($HOUR) is outside operational window. Skipping dispatch."
              exit 0
              ;;
          esac

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: data/*.png
          if-no-files-found: ignore

      - name: Persist Active WhatsApp Session & History
        if: always()
        env:
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
        run: |
          if [ -d "data/whatsapp_session/Default" ] && [ -n "$SESSION_PASSWORD" ]; then
            echo "🔒 Updating encrypted session bundle with active ratchet state..."
            npx tsx scripts/encrypt_session.ts "$SESSION_PASSWORD"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/session_bundle.enc data/live_published_history.json
            git commit -m "chore(session): update active session ratchet & deduplication history [skip ci]" || echo "No changes to commit"
            git push origin main || echo "Push skipped or up to date"
          fi
